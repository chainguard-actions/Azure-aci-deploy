name: Test basic usage - no Azure credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires Azure credentials (AZURE_CREDENTIALS env var) to authenticate.
      # Without them, AuthorizerFactory.getAuthorizer() fails and core.setFailed() is called.
      # We verify the action fails gracefully (not a crash/unhandled exception).
      - id: deploy
        uses: .
        continue-on-error: true
        with:
          resource-group: my-resource-group
          dns-name-label: my-container-dns
          image: nginx:latest
          location: eastus
          name: my-container-group

      - name: Assert action failed gracefully without Azure credentials
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded - checking if app-url output is set"
            APP_URL="${{ steps.deploy.outputs.app-url }}"
            echo "app-url: $APP_URL"
            if [ -n "$APP_URL" ]; then
              echo "PASS: action succeeded and produced app-url output"
            else
              echo "FAIL: action succeeded but produced no app-url output"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
