name: Test basic usage - graceful failure without Azure credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          resource-group: test-resource-group
          name: test-container
          image: nginx:latest
          location: eastus
          dns-name-label: test-container-dns
          ports: '80'
          cpu: 1
          memory: 1.5
          os-type: Linux
          ip-address: Public
          restart-policy: Always
          protocol: TCP

      - name: Assert action failed gracefully without Azure credentials
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (Azure credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
