name: Test environment variables input parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts environment-variables in "key=value" space-separated format.
      # The action parses these in _getEnvironmentVariables() before making Azure API calls.
      # Without Azure credentials, the action will fail at getAuthorizer() but should
      # still fail gracefully via core.setFailed() rather than crashing.
      - id: deploy
        uses: .
        continue-on-error: true
        with:
          resource-group: my-resource-group
          dns-name-label: my-container-dns
          image: nginx:latest
          location: eastus
          name: my-container-group
          environment-variables: MY_VAR=hello ANOTHER_VAR=world
          ports: '80 443'
          protocol: TCP
          restart-policy: OnFailure
          os-type: Linux
          cpu: 2
          memory: 2.0

      - name: Assert action failed gracefully with environment variables input
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
            APP_URL="${{ steps.deploy.outputs.app-url }}"
            echo "app-url: $APP_URL"
            if [ -n "$APP_URL" ]; then
              echo "PASS: action succeeded and produced app-url output"
            else
              echo "FAIL: action succeeded but produced no app-url output"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
