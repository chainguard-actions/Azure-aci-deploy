name: Test GPU SKU without GPU count - graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          resource-group: test-resource-group
          name: test-container
          image: nvidia/cuda:11.0-base
          location: eastus
          dns-name-label: test-gpu-container-dns
          gpu-sku: K80

      - name: Assert action failed (gpu-sku without gpu-count or missing Azure credentials)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (gpu-sku without gpu-count or no Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with gpu-sku specified but no gpu-count"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
