name: Test invalid ip-address input - graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          resource-group: test-resource-group
          name: test-container
          image: nginx:latest
          location: eastus
          dns-name-label: test-container-dns
          ip-address: Invalid

      - name: Assert action failed (invalid ip-address or missing Azure credentials)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid ip-address or no Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with invalid ip-address 'Invalid'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
