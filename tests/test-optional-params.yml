name: Test optional parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          resource-group: test-rg
          dns-name-label: test-dns-label
          image: nginx:latest
          location: westus
          name: test-container-opts
          cpu: 2
          memory: 3.5
          ports: '80 443'
          protocol: TCP
          os-type: Linux
          restart-policy: OnFailure
          ip-address: Public
          environment-variables: 'ENV_VAR=value ANOTHER_VAR=hello'
          command-line: '/bin/sh -c echo hello'
      - name: Assert action ran and failed gracefully (no Azure credentials in harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
