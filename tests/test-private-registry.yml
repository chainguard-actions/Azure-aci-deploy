name: Test private registry and private IP configuration - graceful failure without Azure credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          resource-group: test-resource-group
          name: test-private-container
          image: myregistry.azurecr.io/myapp:latest
          location: westus2
          dns-name-label: test-private-dns
          ip-address: Private
          registry-login-server: myregistry.azurecr.io
          registry-username: myregistryuser
          registry-password: myregistrypassword
          ports: '8080'
          restart-policy: Never
          protocol: TCP

      - name: Assert action failed gracefully (no Azure credentials for private registry)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (Azure credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
