name: Test Windows container configuration - graceful failure without Azure credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          resource-group: test-resource-group
          name: test-windows-container
          image: mcr.microsoft.com/windows/servercore:ltsc2019
          location: eastus
          dns-name-label: test-windows-dns
          os-type: Windows
          ports: '80 443'
          cpu: 2
          memory: 3.5
          ip-address: Public
          restart-policy: OnFailure
          protocol: TCP
          environment-variables: 'ENV_VAR1=value1 ENV_VAR2=value2'

      - name: Assert action failed gracefully (no Azure credentials for Windows container)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (Azure credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
